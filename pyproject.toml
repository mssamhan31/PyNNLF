[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pynnlf"
dynamic = ["version"]
description = "Python Network Net Load Forecasting (PyNNLF): reproducible evaluation of net load forecasting models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# --- Runtime dependencies (minimum versions for compatibility) ---
dependencies = [
  "attrs>=24.2.0",
  "certifi>=2025.6.15",
  "charset-normalizer>=3.4.2",
  "click>=8.2.1",
  "cmdstanpy>=1.2.5",
  "colorama>=0.4.6",
  "cftime>=1.6.4.post1",
  "contourpy>=1.3.0",
  "cycler>=0.12.1",
  "DateTime>=5.5",
  "debugpy>=1.8.5",
  "decorator>=5.1.1",
  "dill>=0.3.9",
  "et-xmlfile>=2.0.0",
  "filelock>=3.16.1",
  "fonttools>=4.54.0",
  "fsspec>=2024.12.0",
  "holidays>=0.72",
  "idna>=3.10",
  "importlib_resources>=6.5.2",
  "Jinja2>=3.1.5",
  "joblib>=1.4.2",
  "kiwisolver>=1.4.7",
  "MarkupSafe>=3.0.2",
  "matplotlib>=3.9.2",
  "mpmath>=1.3.0",
  "nbformat>=5.10.4",
  "nest-asyncio>=1.6.0",
  "netCDF4>=1.7.2",
  "networkx>=3.4.2",
  "numpy>=2.1.1",
  "openpyxl>=3.1.5",
  "packaging>=24.1",
  "pandas>=2.2.3",
  "patsy>=1.0.1",
  "pillow>=10.4.0",
  "platformdirs>=4.3.6",
  "prophet>=1.1.6",
  "psutil>=6.0.0",
  "PyYAML>=6.0.2",
  "pyyaml_env_tag>=1.1",
  "pyzmq>=26.2.0",
  "requests>=2.32.4",
  "scikit-learn>=1.6.0",
  "scipy>=1.14.1",
  "shapely>=2.1.1",
  "six>=1.16.0",
  "stanio>=0.5.1",
  "statsmodels>=0.14.4",
  "sympy>=1.13.1",
  "threadpoolctl>=3.5.0",
  "torch>=2.5.1",
  "tornado>=6.4.1",
  "tqdm>=4.67.1",
  "typing_extensions>=4.12.2",
  "tzdata>=2024.1",
  "urllib3>=2.5.0",
  "wcwidth>=0.2.13",
  "xgboost>=3.0.0",
  "zope.interface>=7.0.3",

  # Windows-only:
  "pywin32>=306; platform_system=='Windows'",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "ruff>=0.6.0,<0.17",
]

# Keep notebook tooling optional (since notebooks won't be "the software" anymore)
notebook = [
  "ipykernel>=6.29.5",
  "ipython>=8.27.0",
  "jupyter_client>=8.6.3",
  "jupyter_core>=5.7.2",
  "matplotlib-inline>=0.1.7",
  "prompt_toolkit>=3.0.47",
  "Pygments>=2.18.0",
  "stack-data>=0.6.3",
  "traitlets>=5.14.3",
]

# Keep docs tooling optional
docs = [
  "babel>=2.17.0",
  "backrefs>=5.9",
  "ghp-import>=2.1.0",
  "griffe>=1.14.0",
  "Markdown>=3.9",
  "mergedeep>=1.3.4",
  "mkdocs>=1.6.1",
  "mkdocs-autorefs>=1.4.3",
  "mkdocs-get-deps>=0.2.0",
  "mkdocs-material>=9.6.20",
  "mkdocs-material-extensions>=1.3.1",
  "mkdocstrings>=0.30.0",
  "mkdocstrings-python>=1.18.2",
  "paginate>=0.5.7",
  "pathspec>=0.12.1",
  "pymdown-extensions>=10.16.1",
  "PyYAML>=6.0.2",
  "watchdog>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = []

[tool.setuptools.dynamic]
version = { attr = "pynnlf.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynnlf = ["scaffold/**/*"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's defaults widened in 0.16, so leaving this
# unset means CI enforces a different standard each time a new ruff is released.
# These are the correctness rules: pyflakes, plus the pycodestyle errors that matter.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The bundled models assign hyperparameters and seeds that are then not used. Whether
# that is a leftover or a genuine reproducibility gap is a modelling decision for the
# author, not something a formatting pass may silently delete, so F841 is not enforced
# here. The individual cases are listed in .ai/tidy-20260903.md.
"src/pynnlf/scaffold/models/*.py" = ["F841"]
