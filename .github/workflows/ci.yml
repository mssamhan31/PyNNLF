name: CI (smoke tests)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run smoke tests (warning-only)
        run: |
          python -c "import pynnlf; pynnlf.init('ws_ci', download_data=False); pynnlf.run_tests('ws_ci/specs/tests_ci.yaml')"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynnlf-test-report
          path: ws_ci/experiment_result/Archive/Testing\ Result/*.csv
          if-no-files-found: warn