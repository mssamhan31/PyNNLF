name: Full benchmark (manual)

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run full tests (warning-only)
        run: |
          python -c "import pynnlf; pynnlf.init('ws_full', download_data=False); pynnlf.run_tests('ws_full/specs/tests_full.yaml')"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynnlf-full-test-report
          path: ws_full/experiment_result/Archive/Testing\ Result/*.csv
          if-no-files-found: warn