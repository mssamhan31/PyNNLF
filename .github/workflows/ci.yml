name: CI (smoke tests)

on:
  push:
  pull_request:

jobs:
  smoke:
    name: PyNNLF smoke tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        # requires-python is >=3.11, so exercise the floor as well, on one runner.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Lint
        run: |
          python -m ruff check src tests

      - name: Run unit tests
        run: |
          python -m pytest tests -q

      - name: Prepare CI workspace
        run: |
          python -c "import pynnlf; pynnlf.init('ws_ci')"

      - name: Run smoke tests
        run: |
          python -c "import pynnlf; pynnlf.run_tests('ws_ci/specs/tests_ci.yaml')"

      - name: Run recap experiments
        run: |
          python -c "import pynnlf; pynnlf.recap_experiments('ws_ci/experiment_result')"
          python -c "from pathlib import Path; p = Path('ws_ci/experiment_result/a1_experiment_result.csv'); assert p.exists(), f'Missing recap output: {p}'"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynnlf-test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: "ws_ci/experiment_result/Archive/Testing Result/*.csv"
          if-no-files-found: warn

  publication-notebooks:
    name: Publication notebook artifact rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install jupyter nbconvert nbclient ipykernel

      - name: Verify canonical artifacts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path('.').resolve()
          scripts = root / 'publication' / 'journal_article_1' / 'scripts'
          sys.path.insert(0, str(scripts))
          import notebook_artifact_build as nab
          nab.assert_artifacts()
          print('Canonical artifact parity check passed.')
          PY