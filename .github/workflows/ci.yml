name: CI (smoke tests)

on:
  push:
  pull_request:

jobs:
  smoke:
    name: PyNNLF smoke tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Prepare CI workspace
        run: |
          python -c "import pynnlf; pynnlf.init('ws_ci')"

      - name: Run smoke tests
        run: |
          python -c "import pynnlf; pynnlf.run_tests('ws_ci/specs/tests_ci.yaml')"

      - name: Run recap experiments
        run: |
          python -c "import pynnlf; pynnlf.recap_experiments('ws_ci/experiment_result')"
          python -c "from pathlib import Path; p = Path('ws_ci/experiment_result/a1_experiment_result.csv'); assert p.exists(), f'Missing recap output: {p}'"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynnlf-test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: "ws_ci/experiment_result/Archive/Testing Result/*.csv"
          if-no-files-found: warn

  publication-notebooks:
    name: Publication notebook artifact rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install jupyter nbconvert nbclient ipykernel

      - name: Execute publication notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace publication/journal_article_1/notebooks/00_data_exploration_and_processing/1_build_paper_tables_and_manifest.ipynb
          jupyter nbconvert --to notebook --execute --inplace publication/journal_article_1/notebooks/03_aedp_aggregation_level/5_build_final_figures.ipynb
          jupyter nbconvert --to notebook --execute --inplace publication/journal_article_1/notebooks/02_ashd_148hh_forecast_horizon/3_build_final_figures.ipynb
          jupyter nbconvert --to notebook --execute --inplace publication/journal_article_1/notebooks/01_ashd_aedp_148hh_comparison/2_build_final_figures.ipynb
          jupyter nbconvert --to notebook --execute --inplace publication/journal_article_1/notebooks/04_sa_bess_clean_44hh/8_build_final_figures.ipynb

      - name: Verify canonical artifacts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path('.').resolve()
          scripts = root / 'publication' / 'journal_article_1' / 'scripts'
          sys.path.insert(0, str(scripts))
          import notebook_artifact_build as nab
          nab.assert_artifacts()
          print('Canonical artifact parity check passed.')
          PY